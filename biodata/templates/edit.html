{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>DIGIDAW - Edit Theme</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: '{{ theme.font|default:"Poppins" }}', sans-serif !important;
            color: {{ theme.color|default:"#ffffff" }} !important;
        }

        .edit-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .edit-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 50px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .edit-box h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .edit-box p.subtitle {
            font-size: 13px;
            opacity: 0.4;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            letter-spacing: 1.5px;
            opacity: 0.5;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border 0.3s;
            font-family: inherit;
        }

        .form-group select:focus {
            border: 1px solid rgba(0, 198, 255, 0.5);
        }

        .form-group select option {
            background: #1a1a2e;
            color: white;
        }

        .color-preview {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            background: white;
        }

        .btn-save {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn-save:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
        }

        .btn-back {
            display: inline-block;
            margin-top: 16px;
            font-size: 12px;
            opacity: 0.4;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }

        .btn-back:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar" style="position: relative;">
        <a href="/" class="logo">DIGIDAW</a>
        <button id="editBtn" class="button" style="position: absolute; left: 50%; transform: translateX(-50%);">Edit</button>
    </div>

    <!-- EDIT FORM -->
    <div class="edit-container">
        <div class="edit-box">
            <h2>Edit Theme</h2>
            <p class="subtitle">CUSTOMIZE YOUR EXPERIENCE</p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Font</label>
                    <select name="font">
                        <option value="Poppins" {% if theme.font == "Poppins" %}selected{% endif %}>Poppins</option>
                        <option value="Arial" {% if theme.font == "Arial" %}selected{% endif %}>Arial</option>
                        <option value="Courier New" {% if theme.font == "Courier New" %}selected{% endif %}>Courier New</option>
                        <option value="Verdana" {% if theme.font == "Verdana" %}selected{% endif %}>Verdana</option>
                        <option value="Georgia" {% if theme.font == "Georgia" %}selected{% endif %}>Georgia</option>
                        <option value="Times New Roman" {% if theme.font == "Times New Roman" %}selected{% endif %}>Times New Roman</option>
                        <option value="Trebuchet MS" {% if theme.font == "Trebuchet MS" %}selected{% endif %}>Trebuchet MS</option>
                        <option value="Impact" {% if theme.font == "Impact" %}selected{% endif %}>Impact</option>
                        <option value="Comic Sans MS" {% if theme.font == "Comic Sans MS" %}selected{% endif %}>Comic Sans MS</option>
                        <option value="Lucida Console" {% if theme.font == "Lucida Console" %}selected{% endif %}>Lucida Console</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Text Color</label>
                    <select name="color">
                        <option value="#ffffff" {% if theme.color == "#ffffff" %}selected{% endif %}>White</option>
                        <option value="#000000" {% if theme.color == "#000000" %}selected{% endif %}>Black</option>
                        <option value="#ff4d4d" {% if theme.color == "#ff4d4d" %}selected{% endif %}>Red</option>
                        <option value="#00ffcc" {% if theme.color == "#00ffcc" %}selected{% endif %}>Cyan</option>
                        <option value="#00c6ff" {% if theme.color == "#00c6ff" %}selected{% endif %}>Blue</option>
                        <option value="#ffcc00" {% if theme.color == "#ffcc00" %}selected{% endif %}>Yellow</option>
                        <option value="#ff66cc" {% if theme.color == "#ff66cc" %}selected{% endif %}>Pink</option>
                        <option value="#66ff66" {% if theme.color == "#66ff66" %}selected{% endif %}>Green</option>
                        <option value="#ffa500" {% if theme.color == "#ffa500" %}selected{% endif %}>Orange</option>
                        <option value="#cccccc" {% if theme.color == "#cccccc" %}selected{% endif %}>Gray</option>
                    </select>
                </div>

                <button class="btn-save" type="submit">Save Changes</button>
            </form>

            <a href="/" class="btn-back">← Back to Home</a>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">© 2026 DIGIDAW Team</div>

    {% load static %}
    <script src="{% static 'script.js' %}"></script>
</body>
</html>
